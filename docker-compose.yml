services:
  ftir-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HOST: ${HOST}
      PORT: ${PORT}
      REFERENCE_DIR: /app/references
      LLM_PROVIDER: gemini
      LLM_MODEL: ${LLM_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    ports:
      - "8787:8787"
    restart: unless-stopped
    init: true